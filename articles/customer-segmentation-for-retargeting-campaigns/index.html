    <script id="page-data" type="application/json">{"slug":"customer-segmentation-for-retargeting-campaigns","title":"تصنيف العملاء لحملات إعادة الاستهداف: أرسل العرض المناسب للعميل المناسب","excerpt":"اكتشف كيف يحوّل التصنيف الذكي للعملاء بناءً على سلوك الشراء والقيمة الشرائية حملات إعادة الاستهداف من رسائل عشوائية إلى عروض مخصصة عالية التحويل.","tags":["التجارة الإلكترونية","تصنيف العملاء"],"date":"March 19, 2026","html":"\u003cp>إرسال نفس الرسالة الترويجية لقائمة عملائك بالكامل قد يبدو فعّالاً، لكنه أسرع طريقة لاستنزاف ميزانيتك التسويقية بأقل عائد. المشتري لأول مرة، والعميل المخلص، ومن ترك سلته قبل ثلاثة أشهر كلهم لديهم احتياجات مختلفة تماماً — ويستجيبون لرسائل مختلفة تماماً.\u003c/p>\n\u003ch2 id=\"s1\">ما هو تصنيف العملاء؟\u003c/h2>\n\u003cp>\u003cstrong>تصنيف العملاء هو عملية تقسيم قاعدة عملائك إلى مجموعات متمايزة بناءً على خصائص مشتركة — مثل تاريخ الشراء، أو حجم الإنفاق، أو سلوك التصفح، أو مستوى التفاعل — حتى تتمكن من استهداف كل مجموعة بالرسالة والعرض الأنسب لها.\u003c/strong>\u003c/p>\n\u003cp>بدلاً من نهج واحد يناسب الجميع، التصنيف يتيح لك مخاطبة كل عميل بطريقة تناسب موقعه في رحلته مع متجرك. وهو من أقوى الإمكانيات التي تقدمها \u003ca href=\"../../articles/what-is-a-customer-service-platform/\">منصة خدمة العملاء\u003c/a> المتكاملة.\u003c/p>\n\u003ch2 id=\"s2\">لماذا تفشل الحملات العامة؟\u003c/h2>\n\u003cp>عندما ترسل نفس حملة الواتساب لـ 10,000 عميل، تحدث عدة أشياء:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>العملاء ذوو القيمة العالية\u003c/strong> يتلقون نفس الخصم العام الذي يحصل عليه العملاء الجدد، مما يُقلل من قيمة ولائهم.\u003c/li>\n\u003cli>\u003cstrong>العملاء الخاملون\u003c/strong> يتلقون رسائل عن منتجات لم يُبدوا اهتماماً بها أبداً، فيتجاهلونها.\u003c/li>\n\u003cli>\u003cstrong>المشترون الجدد\u003c/strong> يُدفعون للشراء مجدداً فوراً، وهو ما يبدو عدوانياً.\u003c/li>\n\u003cli>\u003cstrong>معدل إلغاء الاشتراك\u003c/strong> يرتفع لأن العملاء يشعرون بأن الرسائل لا تخصهم.\u003c/li>\n\u003c/ul>\n\u003cp>النتيجة: تفاعل منخفض، إنفاق مهدر، وعلاقة متضررة مع أفضل عملائك.\u003c/p>\n\u003ch2 id=\"s3\">أهم نماذج تصنيف العملاء في التجارة الإلكترونية\u003c/h2>\n\u003ch3>1. التصنيف حسب سلوك الشراء\u003c/h3>\n\u003cp>هذا أكثر التصنيفات فاعلية لإعادة الاستهداف. قسّم عملاءك حسب ما اشتروه وكيف اشتروا:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>المشترون لأول مرة\u003c/strong>: اشتروا مرة واحدة. ركّز على تشجيع الشراء الثاني — هذا هو التحويل الحرج من عميل المرة الواحدة إلى عميل متكرر.\u003c/li>\n\u003cli>\u003cstrong>العملاء المتكررون\u003c/strong>: اشتروا 2-4 مرات. يثقون بمتجرك. كافئ ولاءهم وعرّفهم على فئات جديدة.\u003c/li>\n\u003cli>\u003cstrong>عملاء VIP\u003c/strong>: أعلى 10-20% من حيث عدد الطلبات. امنحهم وصولاً حصرياً مبكراً ومعاملة مميزة وتوصيات مخصصة.\u003c/li>\n\u003cli>\u003cstrong>العملاء الخاملون\u003c/strong>: لم يشتروا منذ أكثر من 60 يوماً رغم نشاطهم السابق. يحتاجون سبباً مقنعاً للعودة.\u003c/li>\n\u003c/ul>\n\u003ch3>2. التصنيف حسب القيمة الشرائية الإجمالية (CLV)\u003c/h3>\n\u003cp>ليس كل العملاء متساوين في القيمة. عميل ينفق 500 ريال مرة واحدة مختلف تماماً عن عميل ينفق 200 ريال كل شهر. التصنيف حسب القيمة الشرائية يساعدك في:\u003c/p>\n\u003cul>\n\u003cli>تخصيص أفضل عروضك للعملاء الأكثر احتمالاً لتحقيق إيرادات طويلة المدى.\u003c/li>\n\u003cli>تحديد أي الشرائح تستحق إنفاقاً تسويقياً أعلى.\u003c/li>\n\u003cli>اكتشاف العملاء ذوي الإمكانات العالية مبكراً ورعايتهم قبل أن يخملوا.\u003c/li>\n\u003c/ul>\n\u003cp>تتبع القيمة الشرائية مع \u003ca href=\"../../articles/customer-service-kpis-in-ecommerce/\">مؤشرات أداء خدمة العملاء\u003c/a> الأخرى يكشف العائد الحقيقي لجهود الدعم والحملات.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>الشريحة\u003c/th>\u003cth>القيمة الشرائية\u003c/th>\u003cth>استراتيجية الحملة\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>قيمة عالية\u003c/strong>\u003c/td>\u003ctd>أعلى 20%\u003c/td>\u003ctd>وصول حصري، إطلاقات مبكرة، مكافآت ولاء\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>قيمة متوسطة\u003c/strong>\u003c/td>\u003ctd>الـ 50% الوسطى\u003c/td>\u003ctd>بيع إضافي، بيع تكميلي، توسيع الفئات\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>قيمة منخفضة\u003c/strong>\u003c/td>\u003ctd>أدنى 30%\u003c/td>\u003ctd>عروض إعادة تفاعل، تعريف بالمنتجات، حوافز السلة\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch3>3. التصنيف حسب فئة المنتج\u003c/h3>\n\u003cp>العملاء الذين يشترون من فئات محددة أظهروا تفضيلات واضحة. عميل يشتري منتجات العناية بالبشرة باستمرار لا يحتاج لرؤية عروض الإلكترونيات. التصنيف حسب الفئة يضمن أن كل حملة تبدو ذات صلة:\u003c/p>\n\u003cul>\n\u003cli>روّج للوافدين الجدد ضمن الفئات التي يشتري منها العميل بالفعل.\u003c/li>\n\u003cli>قدّم بيعاً تكميلياً لفئات مرتبطة (مثلاً من يشتري حبوب القهوة قد يهتم بأدوات تحضير القهوة).\u003c/li>\n\u003cli>تجنّب العروض غير المرتبطة التي تدرّب العميل على تجاهل رسائلك.\u003c/li>\n\u003c/ul>\n\u003ch3>4. التصنيف حسب مستوى التفاعل\u003c/h3>\n\u003cp>بعيداً عن المشتريات، طريقة تفاعل العملاء مع رسائلك مهمة:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>عالي التفاعل\u003c/strong>: يفتح ويرد على الرسائل بانتظام. آمن للتواصل معه بشكل أكثر تكراراً بعروض جديدة.\u003c/li>\n\u003cli>\u003cstrong>متوسط التفاعل\u003c/strong>: يفتح الرسائل لكن نادراً ما يتفاعل. جرّب عروضاً وصيغاً وتوقيتات مختلفة.\u003c/li>\n\u003cli>\u003cstrong>منخفض التفاعل\u003c/strong>: نادراً ما يفتح الرسائل. قلّل التكرار، جرّب حملة إعادة تفاعل جريئة، أو قد تخسره.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"s4\">أمثلة عملية لحملات تصنيف تحقق نتائج\u003c/h2>\n\u003cp>إليك أمثلة حملات محددة باستخدام التصنيف:\u003c/p>\n\u003ch3>للمشترين لأول مرة (بعد 7 أيام من الشراء)\u003c/h3>\n\u003cblockquote>\n\u003cp>\"شكراً على طلبك الأول! خصم 10% على طلبك القادم — صالح لمدة 14 يوماً. محتاج مساعدة في الاختيار؟ رد علينا ونرشحلك منتجات بناءً على اللي عجبك.\"\u003c/p>\n\u003c/blockquote>\n\u003ch3>لعملاء VIP (إطلاق منتج جديد)\u003c/h3>\n\u003cblockquote>\n\u003cp>\"كعميل مميز، تحصل على أول وصول لمجموعتنا الجديدة — قبل الجميع بـ 24 ساعة. تصفحها الآن.\"\u003c/p>\n\u003c/blockquote>\n\u003ch3>للعملاء الخاملين (60+ يوم بدون نشاط)\u003c/h3>\n\u003cblockquote>\n\u003cp>\"اشتقنالك! خصم حصري 15% على [الفئة التي اشتروا منها سابقاً]. العرض صالح هالأسبوع فقط.\"\u003c/p>\n\u003c/blockquote>\n\u003ch3>لتاركي السلات (حسب الفئة)\u003c/h3>\n\u003cblockquote>\n\u003cp>\"لسا تفكر في [اسم المنتج]؟ الطلب عليه عالي — باقي [عدد] فقط بالمخزون. أكمل طلبك الآن.\"\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"s5\">التصنيف اليدوي مقابل التلقائي\u003c/h2>\n\u003cp>كثير من المتاجر تحاول التصنيف يدوياً — تصدير قوائم العملاء، والفلترة في جداول البيانات، ورفع مجموعات جهات الاتصال. هذا النهج له قيود جدية:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>بطيء\u003c/strong>: بحلول ما تبني الشريحة، تكون اللحظة فاتت.\u003c/li>\n\u003cli>\u003cstrong>ثابت\u003c/strong>: الشريحة لا تتحدث مع تغير سلوك العملاء في الشراء أو الخمول.\u003c/li>\n\u003cli>\u003cstrong>معرض للخطأ\u003c/strong>: العمليات اليدوية تؤدي لرسائل مكررة وعملاء مفقودين وتصنيفات خاطئة.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>التصنيف التلقائي\u003c/strong> — حيث تصنّف المنصة العملاء باستمرار بناءً على بيانات فورية — يزيل كل هذه المشاكل. العملاء ينتقلون بين الشرائح تلقائياً مع تغير سلوكهم، والحملات تستهدف دائماً الأشخاص المناسبين.\u003c/p>\n\u003ch2 id=\"s6\">كيف تجعل المنصات المتخصصة التصنيف سهلاً\u003c/h2>\n\u003cp>\u003ca href=\"../../articles/why-do-i-need-a-specialized-ecommerce-customer-service-platform/\">المنصة المتخصصة في التجارة الإلكترونية\u003c/a> المرتبطة بمتجرك تستطيع تصنيف العملاء تلقائياً لأنها تملك وصولاً مباشراً إلى:\u003c/p>\n\u003cul>\n\u003cli>تاريخ الطلبات الكامل وبيانات السلة.\u003c/li>\n\u003cli>كتالوج المنتجات ومعلومات الفئات.\u003c/li>\n\u003cli>تاريخ تفاعل وتواصل العميل.\u003c/li>\n\u003cli>القيمة الشرائية المحسوبة لكل عميل.\u003c/li>\n\u003c/ul>\n\u003cp>هذا يعني أنك لا تحتاج لتصدير أو فلترة أو تخمين. المنصة تبني وتحافظ على شرائحك في الوقت الفعلي، وتطلق الحملات لأي شريحة بنقرات قليلة.\u003c/p>\n\u003cp>\u003cstrong>منصة مجيب\u003c/strong> تأخذ هذا أبعد بدمج \u003ca href=\"../../articles/retargeting-and-automations/\">التصنيف التلقائي مع محادثات مدعومة بالذكاء الاصطناعي\u003c/a>. عندما يتلقى عميل في شريحة معينة حملة ويرد عليها، \u003ca href=\"https://www.linkedin.com/posts/intelidexer_aepaesaeyaeraepaejabraepaesaepaedaefaeuaepaehaey-activity-7436483728010391552-DOHc\" target=\"_blank\" rel=\"noreferrer\">مجيبAI\u003c/a> يفهم سياقه — تاريخ شرائه، وشريحته، والحملة التي يرد عليها — ويُكمل المحادثة بذكاء لإتمام البيع.\u003c/p>\n\u003ch2 id=\"s7\">الخلاصة\u003c/h2>\n\u003cp>تصنيف العملاء هو الفارق بين حملات تحقق مبيعات وحملات تُتجاهل. بتقسيم العملاء حسب سلوك الشراء والقيمة الشرائية ومستوى التفاعل، تضمن أن كل رسالة ذات صلة، وكل عرض مقنع، وكل ريال من إنفاق الحملات يعمل بأقصى كفاءة. المتاجر التي تنمو ليست التي ترسل أكثر الرسائل — بل التي ترسل الرسالة المناسبة للعميل المناسب.\u003c/p>","headings":[{"id":"s1","text":"ما هو تصنيف العملاء؟"},{"id":"s2","text":"لماذا تفشل الحملات العامة؟"},{"id":"s3","text":"أهم نماذج تصنيف العملاء في التجارة الإلكترونية"},{"id":"s4","text":"أمثلة عملية لحملات تصنيف تحقق نتائج"},{"id":"s5","text":"التصنيف اليدوي مقابل التلقائي"},{"id":"s6","text":"كيف تجعل المنصات المتخصصة التصنيف سهلاً"},{"id":"s7","text":"الخلاصة"}],"readMinutes":5}</script>
